<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <style>
      .bg-glow-cyan { fill: url(#cyanGlowGrad); opacity: 0.3; }
      .bg-glow-purple { fill: url(#purpleGlowGrad); opacity: 0.25; }
    </style>
    <radialGradient id="cyanGlowGrad" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlowGrad" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#050816"/>
  <rect width="1200" height="400" class="bg-glow-cyan"/>
  <rect width="1200" height="400" class="bg-glow-purple"/>

  <!-- Geometric Glass Elements -->
  <g fill="url(#glassCardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5">
    <rect x="60" y="50" width="320" height="140" rx="20"/>
    <rect x="420" y="80" width="360" height="180" rx="24"/>
    <rect x="820" y="40" width="320" height="160" rx="20"/>
    <rect x="180" y="220" width="400" height="140" rx="20"/>
  </g>

  <!-- Ambient Light Wave Rays -->
  <path d="M0 200 Q 300 100 600 250 T 1200 180" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="3"/>
  <path d="M0 260 Q 400 320 800 180 T 1200 240" fill="none" stroke="rgba(168, 85, 247, 0.15)" stroke-width="3"/>
</svg>
