<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800;900&amp;display=swap');

      .hero-font { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      
      .gradient-title {
        fill: url(#heroTitleGrad);
      }

      .float-particle {
        animation: particleFloat 6s ease-in-out infinite alternate;
      }
      .float-particle-2 {
        animation: particleFloat2 8s ease-in-out infinite alternate;
      }

      @keyframes particleFloat {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        100% { transform: translateY(-18px) scale(1.2); opacity: 0.8; }
      }

      @keyframes particleFloat2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        100% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
      }
    </style>

    <!-- Background Ambient Light Orbs -->
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleOrb" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueOrb" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)"/>
    </linearGradient>

    <linearGradient id="heroTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="btnPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.6)"/>
    </linearGradient>

    <!-- Clip path for portrait frame -->
    <clipPath id="portraitClip">
      <rect x="10" y="10" width="300" height="340" rx="24"/>
    </clipPath>

    <!-- Filters -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#38BDF8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="28" fill="#050816"/>
  <rect width="1200" height="520" rx="28" fill="url(#cyanOrb)"/>
  <rect width="1200" height="520" rx="28" fill="url(#purpleOrb)"/>
  <rect width="1200" height="520" rx="28" fill="url(#blueOrb)"/>

  <!-- Background Cyber Grid Matrix -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200 M0 480 H1200"/>
    <path d="M100 0 V520 M200 0 V520 M300 0 V520 M400 0 V520 M500 0 V520 M600 0 V520 M700 0 V520 M800 0 V520 M900 0 V520 M1000 0 V520 M1100 0 V520"/>
  </g>

  <!-- Ambient Particle Stars -->
  <g fill="#38BDF8">
    <circle cx="150" cy="100" r="2.5" class="float-particle"/>
    <circle cx="280" cy="420" r="2" class="float-particle-2"/>
    <circle cx="620" cy="80" r="3" class="float-particle"/>
    <circle cx="1080" cy="140" r="2" class="float-particle-2"/>
    <circle cx="950" cy="460" r="3.5" class="float-particle"/>
    <circle cx="450" cy="480" r="2.5" class="float-particle-2"/>
  </g>

  <!-- Outer Glassmorphic Main Card -->
  <rect x="20" y="20" width="1160" height="480" rx="24" fill="url(#heroCardBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#cardGlow)"/>

  <!-- Left Column Content -->
  <g transform="translate(60, 60)">
    <!-- Role Badge -->
    <rect x="0" y="0" width="370" height="34" rx="17" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#38BDF8"/>
    <text x="32" y="22" class="hero-font" font-weight="700" font-size="12" fill="#38BDF8" letter-spacing="1">FULL STACK DEVELOPER • AI ENGINEER</text>

    <!-- Large Name Typography -->
    <text x="0" y="125" class="hero-font gradient-title" font-weight="900" font-size="76" letter-spacing="-2">KARTIK SONI</text>

    <!-- Subtitle / Headline -->
    <text x="0" y="175" class="hero-font" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="-0.3">
      Architecting Next-Gen AI Products &amp; Premium Modern UI
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="220" class="hero-font" font-weight="400" font-size="16" fill="#94A3B8" width="540">
      <tspan x="0" dy="0">Specializing in high-performance full-stack web applications, AI integrations,</tspan>
      <tspan x="0" dy="26">interactive 3D web experiences, and scalable cloud architecture.</tspan>
    </text>

    <!-- Location & Status Pills -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="16" y="19" class="hero-font" font-weight="600" font-size="13" fill="#FFFFFF">📍 India</text>

      <rect x="142" y="0" width="180" height="30" rx="15" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <text x="156" y="19" class="hero-font" font-weight="600" font-size="13" fill="#C084FC">✦ UI/UX Enthusiast</text>
    </g>

    <!-- CTA Button Previews in SVG -->
    <g transform="translate(0, 340)">
      <!-- Primary CTA: Portfolio -->
      <rect x="0" y="0" width="170" height="48" rx="14" fill="url(#btnPrimary)"/>
      <text x="85" y="29" class="hero-font" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">View Portfolio ↗</text>

      <!-- Secondary CTA: Resume -->
      <rect x="185" y="0" width="160" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <text x="265" y="29" class="hero-font" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">Get Resume 📄</text>

      <!-- Social Button 1: GitHub -->
      <rect x="360" y="0" width="48" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <path d="M384 16 C377.4 16 372 21.4 372 28 C372 33.3 375.4 37.8 380.2 39.4 C380.8 39.5 381 39.1 381 38.8 V36.6 C377.7 37.3 377 35.2 377 35.2 C376.5 33.9 375.7 33.5 375.7 33.5 C374.6 32.7 375.8 32.7 375.8 32.7 C377 32.8 377.6 34 377.6 34 C378.7 35.8 380.4 35.3 381 35 C381.1 34.2 381.4 33.7 381.8 33.3 C379.1 33 376.3 32 376.3 27.4 C376.3 26.1 376.8 25 377.6 24.2 C377.4 23.9 377 22.6 377.7 20.9 C377.7 20.9 378.7 20.6 381 22.2 C382 21.9 383 21.8 384 21.8 C385 21.8 386 21.9 387 22.2 C389.3 20.6 390.3 20.9 390.3 20.9 C391 22.6 390.6 23.9 390.4 24.2 C391.2 25 391.7 26.1 391.7 27.4 C391.7 32 388.9 33 386.2 33.3 C386.7 33.7 387 34.5 387 35.7 V38.8 C387 39.1 387.2 39.5 387.8 39.4 C392.6 37.8 396 33.3 396 28 C396 21.4 390.6 16 384 16 Z" fill="#FFFFFF"/>

      <!-- Social Button 2: LinkedIn -->
      <rect x="420" y="0" width="48" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <path d="M434 22 H438 V36 H434 Z M436 16 C437.3 16 438.3 17 438.3 18.3 C438.3 19.6 437.3 20.6 436 20.6 C434.7 20.6 433.7 19.6 433.7 18.3 C433.7 17 434.7 16 436 16 Z M441 22 H445 V24 C445.6 23 447.2 21.7 449.5 21.7 C454 21.7 455 24.5 455 28.5 V36 H451 V29.5 C451 27.5 450.5 25.5 448.2 25.5 C446 25.5 445 27 445 29.5 V36 H441 V22 Z" fill="#38BDF8"/>
    </g>
  </g>

  <!-- Right Side Frame Backdrop Graphic (Embedded Kartik Soni Real Portrait) -->
  <g transform="translate(760, 70)">
    <!-- Ambient Blue/Purple Aura Glow behind frame -->
    <rect x="-10" y="-10" width="340" height="380" rx="36" fill="url(#btnBorder)" opacity="0.4" filter="url(#cardGlow)"/>

    <!-- Outer Glass Frame Shell -->
    <rect x="0" y="0" width="320" height="360" rx="32" fill="#0A0F24" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
    
    <!-- Embedded Real Portrait Photo of Kartik Soni -->
    <image href="profile.webp" x="10" y="10" width="300" height="340" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>

    <!-- Inner Glass Overlay Border -->
    <rect x="10" y="10" width="300" height="340" rx="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <!-- Decorative Corner Tech Accents -->
    <path d="M20 40 V20 H40" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M300 40 V20 H280" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 320 V340 H40" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
    <path d="M300 320 V340 H280" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>

    <!-- Floating Glass Stat Chip 1 (Top Left) -->
    <g transform="translate(-30, 30)">
      <rect x="0" y="0" width="140" height="42" rx="14" fill="#0A0F24" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
      <text x="15" y="25" class="hero-font" font-weight="800" font-size="14" fill="#38BDF8">⚡ 100%</text>
      <text x="72" y="25" class="hero-font" font-weight="600" font-size="11" fill="#94A3B8">Quality</text>
    </g>

    <!-- Floating Glass Stat Chip 2 (Bottom Right) -->
    <g transform="translate(190, 290)">
      <rect x="0" y="0" width="150" height="42" rx="14" fill="#0A0F24" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5"/>
      <text x="15" y="25" class="hero-font" font-weight="800" font-size="14" fill="#C084FC">🚀 AI / SaaS</text>
      <text x="96" y="25" class="hero-font" font-weight="600" font-size="11" fill="#94A3B8">Dev</text>
    </g>
  </g>
</svg>
