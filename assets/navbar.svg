<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap');
      .nav-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .glow-pulse { animation: pulse 2.5s infinite ease-in-out; }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.1); }
      }
      .green-pulse { animation: statusPulse 2s infinite ease-in-out; }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; r: 5px; }
        50% { opacity: 0.4; r: 7px; }
      }
    </style>
    
    <linearGradient id="navBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="ksLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="navShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#38BDF8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Navbar Glass Shell -->
  <rect x="10" y="10" width="1180" height="60" rx="20" fill="url(#navBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#navShadow)"/>
  
  <!-- Left Brand Logo -->
  <g transform="translate(30, 20)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#ksLogoGrad)" stroke-width="2.5"/>
    <circle cx="20" cy="20" r="14" fill="#0A0F24"/>
    <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">KS</text>
  </g>
  <text x="80" y="45" class="nav-text" font-weight="700" font-size="16" fill="#FFFFFF" letter-spacing="0.5">KARTIK SONI</text>

  <!-- Center Navigation Items -->
  <g transform="translate(380, 26)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="80" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="40" y="18" class="nav-text" font-weight="600" font-size="12" fill="#38BDF8" text-anchor="middle">About</text>

    <!-- Pill 2 -->
    <rect x="95" y="0" width="90" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="140" y="18" class="nav-text" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">Projects</text>

    <!-- Pill 3 -->
    <rect x="200" y="0" width="100" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="250" y="18" class="nav-text" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">Experience</text>

    <!-- Pill 4 -->
    <rect x="315" y="0" width="80" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="355" y="18" class="nav-text" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">Skills</text>

    <!-- Pill 5 -->
    <rect x="410" y="0" width="80" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="450" y="18" class="nav-text" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">Contact</text>
  </g>

  <!-- Right Status Badge -->
  <g transform="translate(940, 24)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="url(#badgeGlow)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#22C55E" class="green-pulse"/>
    <text x="34" y="20" class="nav-text" font-weight="700" font-size="11" fill="#4ADE80" letter-spacing="0.8">AVAILABLE FOR WORK</text>
  </g>
</svg>
